name: Assignment 15 Security CI
on:
  push:
    branches:
      - 15th-assignment
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth-service:
    name: Auth Service - Build, Migration, Tests and Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: auth_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'ci-test-only-db-password' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d auth_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'ci-test-only-db-password' }}
      DB_NAME: auth_db
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET || 'ci-test-only-jwt-secret-value-with-at-least-32-chars' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/auth-service/package-lock.json
      - name: Validate CI test configuration
        shell: bash
        run: |
          if [[ -z "$DB_PASSWORD" || -z "$JWT_SECRET" ]]; then
            echo "::error::CI database password and JWT key must be configured."
            exit 1
          fi
          if [[ ${#JWT_SECRET} -lt 32 ]]; then
            echo "::error::CI_JWT_SECRET must be at least 32 characters."
            exit 1
          fi
      - name: Install dependencies
        working-directory: services/auth-service
        run: npm ci
      - name: Build Auth Service
        working-directory: services/auth-service
        run: npm run build
      - name: Initialize Auth Service database schema
        working-directory: services/auth-service
        run: npm run migrate
      - name: Run Auth Service tests
        working-directory: services/auth-service
        run: npm test
      - name: Run Auth Service lint and formatting checks
        working-directory: services/auth-service
        run: npm run lint
  api-gateway:
    name: API Gateway - Build, Tests and Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET || 'ci-test-only-jwt-secret-value-with-at-least-32-chars' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/api-gateway/package-lock.json
      - name: Validate CI JWT configuration
        shell: bash
        run: |
          if [[ -z "$JWT_SECRET" || ${#JWT_SECRET} -lt 32 ]]; then
            echo "::error::CI JWT key must contain at least 32 characters."
            exit 1
          fi
      - name: Install dependencies
        working-directory: services/api-gateway
        run: npm ci
      - name: Build API Gateway
        working-directory: services/api-gateway
        run: npm run build
      - name: Run API Gateway tests
        working-directory: services/api-gateway
        run: npm test
      - name: Run API Gateway lint and formatting checks
        working-directory: services/api-gateway
        run: npm run lint
