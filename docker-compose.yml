services:
  postgres:
    image: postgres:18
    container_name: bms-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - bms_postgres_data:/var/lib/postgresql

volumes:
  bms_postgres_data: {}